name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start lab
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker compose logs
          exit 1

      - name: Config smoke
        run: |
          curl -sf http://127.0.0.1:8080/api/lab/config | grep -q '"appName"'
          curl -sf http://127.0.0.1:8080/lab/ | grep -q 'Legacy Control Lab'

      - name: Websockify port published
        run: |
          # Browser needs ws://127.0.0.1:6080 — confirm the port accepts TCP.
          timeout 3 bash -c 'echo > /dev/tcp/127.0.0.1/6080' || {
            echo "Port 6080 not reachable"
            docker compose logs
            exit 1
          }

      - name: Stop lab
        if: always()
        run: docker compose down -v
